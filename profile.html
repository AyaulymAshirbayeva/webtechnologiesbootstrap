<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="images/logo.PNG" type="image/png">

    <!-- Bootstrap 5.3.8 CSS -->

    <link rel="stylesheet" href="css/style.css">

<body class="page-profile d-flex flex-column min-vh-100">

    <header class="site-header sticky-top">

            <div class="container-fluid px-lg-5">
                <a href="index.html" class="logo navbar-brand d-flex align-items-center gap-2 fw-bold text-decoration-none fs-4 text-dark">
                    <img src="images/logo.PNG" alt="TilUP logo" width="42" height="42">
                    <span>Til<span class="logo-up">UP</span></span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                    <ul class="navbar-nav align-items-lg-center my-3 my-lg-0 gap-lg-2">
                        <li class="nav-item"><a class="nav-link text-secondary" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-secondary" href="why-learn.html">Why Learn</a></li>
                        <li class="nav-item"><a class="nav-link text-secondary" href="courses.html">Courses</a></li>
                        <li class="nav-item"><a class="nav-link text-secondary" href="tutors.html">Find a Tutor</a></li>
                        <li class="nav-item"><a class="nav-link text-secondary" href="become_tutor.html">Become a Tutor</a></li>
                        <li class="nav-item"><a class="nav-link text-secondary" href="about.html">About Us</a></li>
                    </ul>

                    <!-- Dark Theme Toggle Button -->
                    <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm ms-lg-3 px-3 py-2 fw-bold rounded-2">🌙 Dark</button>
                    
                    <a href="profile.html" class="login-button btn btn-sm fw-bold ms-lg-3 text-decoration-none px-4 py-2 border-0 rounded-2">Profile</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card p-4 p-md-5 border rounded-4 shadow-sm bg-white text-center">
                        <div class="mb-4">
                            <div class="tu-box-subtle tu-icon-box mx-auto rounded-circle bg-light d-flex align-items-center justify-content-center border display-4">
                                👤
                            </div>
                        </div>
                        <h2 class="fw-bold mb-4 text-dark">My Profile</h2>
                        
                        <div class="tu-box-subtle text-start bg-light p-4 rounded-3 border mb-4">
                            <p class="mb-3">
                                <span class="text-secondary fw-bold small text-uppercase">Full Name:</span><br>
                                <span id="profileName" class="fs-5 fw-medium text-dark">Loading...</span>
                            </p>
                            <p class="mb-0">
                                <span class="text-secondary fw-bold small text-uppercase">Email Address:</span><br>
                                <span id="profileEmail" class="fs-5 fw-medium text-dark">Loading...</span>
                            </p>
                        </div>

                        <button id="logoutBtn" type="button" class="btn btn-outline-danger w-100 py-2 fw-bold border-2 rounded-3">
                            Log Out
                        </button>
                    </div>
                </div>
            </div>

        <div class="container">

    </footer>
